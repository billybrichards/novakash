name: One-shot — create bbrhtml DNS record
on:
  workflow_dispatch: {}

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update bbrhtml DNS record
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BBRHTML }}
          FE_HOST:  ${{ secrets.AWS_FRONTEND_HOST }}
          ZONE_ID:  9b10c3fe0870535fdb9516dcb1976d11
        run: |
          set -euo pipefail

          # Auto-detect: IPv4 -> A, IPv6 -> AAAA, hostname -> CNAME.
          # AWS_FRONTEND_HOST is reused from deploy-frontend.yml; it may be
          # an EC2 IP (likely) or an FQDN like *.compute.amazonaws.com.
          if printf '%s' "$FE_HOST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            RECORD_TYPE=A
          elif printf '%s' "$FE_HOST" | grep -q ':'; then
            RECORD_TYPE=AAAA
          else
            RECORD_TYPE=CNAME
          fi
          echo "Detected record type: $RECORD_TYPE"

          # Check if any record (A/AAAA/CNAME) already exists for this name.
          # If a wrong-type record exists, delete it before creating the new one.
          EXISTING_JSON=$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=bbrhtml.billyrichards.com" \
            -H "Authorization: Bearer $CF_TOKEN")
          EXISTING_ID=$(echo "$EXISTING_JSON" | jq -r '.result[0].id // empty')
          EXISTING_TYPE=$(echo "$EXISTING_JSON" | jq -r '.result[0].type // empty')

          PAYLOAD=$(jq -nc --arg t "$RECORD_TYPE" --arg c "$FE_HOST" \
            '{type:$t, name:"bbrhtml", content:$c, proxied:true, ttl:1}')

          if [ -n "$EXISTING_ID" ] && [ "$EXISTING_TYPE" = "$RECORD_TYPE" ]; then
            echo "Updating existing $EXISTING_TYPE record $EXISTING_ID"
            RESP=$(curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EXISTING_ID" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          else
            if [ -n "$EXISTING_ID" ]; then
              echo "Deleting stale $EXISTING_TYPE record $EXISTING_ID before recreating as $RECORD_TYPE"
              curl -sS -X DELETE \
                "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EXISTING_ID" \
                -H "Authorization: Bearer $CF_TOKEN" >/dev/null
            fi
            echo "Creating new $RECORD_TYPE record"
            RESP=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          fi
          echo "$RESP" | jq '{success, errors, result: {id: .result.id, name: .result.name, type: .result.type, proxied: .result.proxied}}'
          # Fail loudly if Cloudflare rejected
          echo "$RESP" | jq -e '.success == true' > /dev/null
