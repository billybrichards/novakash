name: One-shot — create bbrhtml DNS CNAME
on:
  workflow_dispatch: {}

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update bbrhtml CNAME
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_BBRHTML }}
          FE_HOST:  ${{ secrets.AWS_FRONTEND_HOST }}
          ZONE_ID:  9b10c3fe0870535fdb9516dcb1976d11
        run: |
          set -euo pipefail
          # Check if record already exists
          EXISTING=$(curl -sS \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=CNAME&name=bbrhtml.billyrichards.com" \
            -H "Authorization: Bearer $CF_TOKEN" | jq -r '.result[0].id // empty')

          PAYLOAD=$(jq -nc --arg c "$FE_HOST" \
            '{type:"CNAME", name:"bbrhtml", content:$c, proxied:true, ttl:1}')

          if [ -n "$EXISTING" ]; then
            echo "Updating existing record $EXISTING"
            RESP=$(curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$EXISTING" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          else
            echo "Creating new record"
            RESP=$(curl -sS -X POST \
              "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
              -H "Authorization: Bearer $CF_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD")
          fi
          echo "$RESP" | jq '{success, errors, result: {id: .result.id, name: .result.name, type: .result.type, proxied: .result.proxied}}'
          # Fail loudly if Cloudflare rejected
          echo "$RESP" | jq -e '.success == true' > /dev/null
