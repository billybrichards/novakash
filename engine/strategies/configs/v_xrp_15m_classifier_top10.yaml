name: v_xrp_15m_classifier_top10
version: "1.0.0"
mode: GHOST
asset: XRP
timescale: 15m

# XRP 15m top-10% mirror of v_eth_15m_classifier_top10 (88.2% training acc).

gates:
  - type: timing
    params: { min_offset: 180, max_offset: 540 }
  - type: direction
    params: { direction: ANY }
  - type: confidence
    params: { min_dist: 0.18, source: classifier }
  - type: session_hours
    params: { block_hours_utc: [0, 1, 4, 10, 12, 16, 18, 22] }
  - type: regime_v4
    params: { allow: [volatile_trend, chop, risk_off] }
  - type: consecutive_pass_ticks
    params: { min_ticks: 12 }

sizing:
  type: fixed_kelly
  fraction: 0.025
  max_collateral_pct: 0.05
