name: v9_5_xrp_up_solo
strategy_id: v9_5_xrp_up_solo
version: "1.0.0"
# v9_5_xrp_up_solo — 2026-05-25 (GHOST, Billy promotes manually)
# UPDATED 2026-05-26: switched from BLEND to PURE column (timesfm commit e1ba39d)
#
# UP-only XRP 5m strategy reading probability_lgb_v9_5_xrp_pure (PURE column).
# Fires UP at p >= 0.90, within eval_offset [60, 180].
# NO DOWN side — XRP DOWN shows no signal today, needs research.
#
# COLUMN PROVENANCE:
#   probability_lgb_v9_5_xrp_pure = PURE (un-blended LGB+iso) column for the
#   v9.5 XRP-trained model. Emitted when V9_5_XRP_PURE_ENABLED=true (timesfm
#   commit e1ba39d, 2026-05-26). Sibling of probability_lgb_v9_5_xrp (blend).
#   Column signal_evaluations.probability_lgb_v9_5_xrp_pure migration applied.
#   Sample value confirmed: 0.403.
#
# THRESHOLD RATIONALE:
#   PURE threshold p >= 0.90 (Billy's target 90%+ WR for LIVE strategies).
#   BLEND was 0.82 — PURE distributes differently so threshold is reset.
#
# WHY UP-ONLY?
#   XRP DOWN at available thresholds shows no stable signal today (RDS note
#   #694). This needs further research; scaffolding DOWN side now would add
#   noise. If DOWN develops a signal, Billy can create a companion
#   v9_5_xrp_down_solo.
#
# EVAL_OFFSET BAND:
#   [60, 180] — tighter than v9_5_xrp_blend's [60, 240]. The Δ=240s tail
#   adds stale ticks with lower WR (RDS note #694, 2026-05-25).
#
# FILL-BAND GATES (RDS note #664, 2026-05-25):
#   entry_floor_up: 0.60 — skip UP/YES fires where YES fill < 0.60
#   entry_cap_down: 0.90 — present in YAML but unused (no DOWN fires).
#
# RISK / SHADOW SOAK PLAN:
#   max_position_usd=5 to start — shadow soak until 20+ GHOST fires.
#   If 20+ GHOST UP WR >= 85%, promote to LIVE at $5.
#
# References:
#   RDS note #694 — exhaustive threshold sweep (2026-05-25), today's findings
#   RDS note #664 — direction-aware fill-band gate spec
#   RDS note #711 — overnight check (2026-05-26)
#   timesfm commit e1ba39d — V9_5_XRP_PURE_ENABLED flag + emission
#   data_surface.py — probability_lgb_v9_5_xrp_pure field definition
#   Sibling strategies: v9_5_xrp_blend (BLEND, UP p>=0.82 / DOWN p<=0.20)
#                       v9_5_xrp_tight_blend (BLEND, UP p>=0.95 / DOWN p<=0.05)
#
status: GHOST
description: |
  UP-only XRP 5m strategy reading probability_lgb_v9_5_xrp_pure (PURE column,
  switched from BLEND 2026-05-26, timesfm commit e1ba39d). UP at p >= 0.90,
  eval_offset [60, 180]. NO DOWN side (XRP DOWN shows no signal today).
  Direction-aware fill gate: UP floor 0.60. GHOST mode, $5 max_position_usd.
mode: GHOST
asset: XRP
timescale: 5m

hooks_file: v9_5_xrp_up_solo.py
pre_gate_hook: evaluate_v9_5_xrp_up_solo

sizing:
  type: kelly
  fraction: 0.025
  max_collateral_pct: 0.025

gates:
  - type: chainlink_freshness

gate_params:
  up_threshold: 0.90           # PURE threshold (BLEND was 0.82); Billy's 90%+ WR target
  eval_offset_min: 60          # tighter than v9_5_xrp_blend's [60,240] — drops weak tail
  eval_offset_max: 180
  min_consecutive_pass_ticks: 1
  expected_asset: XRP
  entry_cap: 0.90              # cap fill at 0.90 per Billy "max bet 0.9"
  entry_floor_up: 0.60         # skip UP/YES fires if fill < 0.60 (RDS #664)
  entry_cap_down: 0.90         # present but unused — no DOWN fires in this strategy
  collateral_pct: 0.025
  gtc_cap: 0.96

risk:
  max_position_usd: 5          # START LOW — 7d shadow soak before any promotion
  max_daily_loss_usd: 20
