name: v4_fusion_compare_classifier
version: "1.0.0-shadow"
# Comparison shadow strategy — uses probability_classifier (TimesFM Path1
# classifier head) as signal. None on every window where the classifier
# isn't serving — by design — variant SKIPs in that case.
# Pairs with comparison_shadow.py hook. Mode=GHOST, no live trades EVER.
# See hub note #285 for the comparison framework, comparison_shadow.md for design.
mode: GHOST
asset: BTC
timescale: 5m

gates: []

gate_params:
  signal_source: probability_classifier
  shadow_strategy_id: v4_fusion_compare_classifier
  shadow_conviction_floor: 0.10

sizing:
  type: fixed
  fraction: 0.0
  max_collateral_pct: 0.0

hooks_file: comparison_shadow.py
pre_gate_hook: evaluate_comparison_shadow
