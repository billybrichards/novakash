name: v9_3_btc_raw_lgb
strategy_id: v9_3_btc_raw_lgb
version: "1.0.0"
# v9_3_btc_raw_lgb — 2026-05-22 (Billy approved)
#
# Drop-in replacement for v9_2_raw_lgb (BTC 5m). Reads the NEW
# probability_lgb_v9_3_btc signal that the v9.3 BTC LGB head emits
# (companion timesfm PR — not yet opened; Billy approves before that's
# created). v9.3 BTC architecture: walk-forward CV (24-day backtest),
# v9.3-style enriched feature set on the BTC corpus.
#
# Walk-forward CV operating point (timesfm notes #585, #587, #589, #590):
#   - UP threshold 0.72   -> 79.9% WR on 2419 UP windows
#   - DOWN threshold 0.20 -> 82.8% WR on 2320 DOWN windows
#   - +10.2pp UP / +5.6pp DOWN vs the v9.2 BTC LIVE baseline.
#
# Co-exists with v9_2_raw_lgb (CURRENTLY LIVE at UP p>=0.72) — both fire
# on BTC at the same UP threshold but read DIFFERENT probability fields
# (probability_lgb_v9_3_btc vs probability_lgb_v9_2), so the engine writes
# both to signal_evaluations independently and the GHOST shadow window
# decides which one ships LIVE next.
#
# Asset: BTC only. Strategy will SKIP defensively on any non-BTC surface.
# No v9_ensemble base-gate delegation, no cohort gates, no sister-pair veto,
# no cell pauses, no blocked hours. Single qualifying tick is enough
# (matches v9_2_raw_lgb's tick gate so shadow-vs-LIVE comparisons are
# fair).
#
# Defaults GHOST. Billy promotes manually per feedback_no_auto_promote.md
# (post-2026-04-17 rule — no auto-promote). $5 max_position_usd for the
# initial shadow window; raise once shadow data validates the thresholds.
#
# DEPENDENCIES (all required before this strategy can contribute non-NULL
# probability_lgb_v9_3_btc on the surface):
#   1. timesfm-service: load v9.3 BTC booster + emit
#      probability_lgb_v9_3_btc on /v4/snapshot.timescales.5m when
#      V9_3_BTC_ENABLED=true (companion PR not yet opened).
#   2. engine data_surface.py: probability_lgb_v9_3_btc field (added this PR).
#   3. migrations/add_probability_lgb_v9_3_btc_column.sql applied to prod DB.
#   4. engine signal-writer hooked up (added this PR).
#
# Timesfm-repo notes #585 / #587 / #589 / #590 — walk-forward CV results.
# BTC ebook chapter: /home/billyrichards/scans2025/v9_3_btc_ebook_chapter.html
# Engine precedent: feat/v9_5_eth_strategy (PR pending) — mirrored file-for-file.
# Sibling strategy in this PR: v9_3_btc_tight (high-precision corner at 0.935/0.065).
#
status: GHOST
description: |
  Drop-in replacement for v9_2_raw_lgb (BTC 5m). Fires on probability_lgb_v9_3_btc
  alone: UP at p >= 0.72, DOWN at p <= 0.20, within eval_offset [60, 210],
  any single qualifying tick. BTC-only (defensive asset guard). No v9_ensemble
  delegation, no cohort gates, no veto layers, no cell pauses, no blocked hours.
  GHOST mode, $5 max_position_usd for the initial shadow window. Walk-forward
  CV: 79.9% UP WR (2419 windows) / 82.8% DOWN WR (2320 windows) — +10.2pp UP
  / +5.6pp DOWN vs v9.2 BTC LIVE baseline.
mode: GHOST
asset: BTC
timescale: 5m

hooks_file: v9_3_btc_raw_lgb.py
pre_gate_hook: evaluate_v9_3_btc_raw_lgb

sizing:
  type: kelly
  fraction: 0.025
  max_collateral_pct: 0.025

gates:
  - type: chainlink_freshness

gate_params:
  up_threshold: 0.72
  down_threshold: 0.20
  eval_offset_min: 60
  eval_offset_max: 210
  min_consecutive_pass_ticks: 1
  expected_asset: BTC
  entry_cap: 0.85
  collateral_pct: 0.025
  gtc_cap: 0.90

risk:
  max_position_usd: 5
  max_daily_loss_usd: 20
