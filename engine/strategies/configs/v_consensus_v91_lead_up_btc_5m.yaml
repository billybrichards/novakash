name: v_consensus_v91_lead_up_btc_5m
version: "1.0.0"
mode: GHOST
asset: BTC
timescale: 5m

# Variant of consensus_3of5 that drops v9 PROD and uses v9.1 instead as the
# LGB anchor. Tests whether "v9.1 + v10 + v12 + classifier" 3-of-4 vote
# beats the 5-model 3-of-5 vote (which includes both v9 + v9.1 with
# heavily correlated outputs).

gates:
  - type: timing
    params: { min_offset: 30, max_offset: 120 }
  - type: direction
    params: { direction: UP }
  - type: multi_model_consensus
    params:
      models: [v9_1, v10, v12, classifier]
      direction: UP
      min_votes: 3
      vote_threshold_up: 0.55
  - type: regime_v4
    params: { allow: [volatile_trend, chop, risk_off] }
  # Safety gates added 2026-05-04 (PR: feat/add-safety-gates-strict-strategies)
  # to close the strict-gate-list oracle/fill_band/vpin safety gap.
  - type: oracle_direction
    params: { direction: UP }
  - type: vpin_gate
    params: { min: 0.40, block_cascade: true }
  - type: fill_band
    params: { direction: UP, min_fill_price: 0.20, max_fill_price: 0.82 }
  - type: consecutive_pass_ticks
    params: { min_ticks: 10 }

sizing:
  type: fixed_kelly
  fraction: 0.025
  max_collateral_pct: 0.05
