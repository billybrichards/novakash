name: v8_champion_cedar
version: 8.0.0-cedar
mode: GHOST
asset: BTC
timescale: 5m
gates: []
gate_params:
  v2_probability_source: cedar
  min_offset_sec: 30
  max_offset_sec: 240
  tradeable_v4_regimes:
  - volatile_trend
  - chop
  - risk_off
  - calm_trend
  require_high_conviction: true
  bucket_abs_dist_strong: 0.15
  bucket_path1_extreme_high: 0.9
  bucket_path1_extreme_low: 0.1
  fill_band_min: 0.3
  fill_band_max: 0.82
  up_min_fill_price: 0.0
  up_require_both_buckets: true
  blocked_utc_hours: []
  source_agreement_require_chainlink: true
  source_agreement_require_tiingo: true
  skip_on_oracle_disagree: false
  vpin_min: 0.4
  vpin_max: 1.0
  risk_off_override_enabled: false
  ensemble_signal_source: ensemble
  prefer_raw_probability: true
sizing:
  type: custom
  custom_hook: clob_sizing
  fraction: 0.025
  max_collateral_pct: 0.058
  schedule:
  - threshold: 0.55
    modifier: 2.0
    label: high_conv_full
  - threshold: 0.35
    modifier: 1.2
    label: mid
  - threshold: 0.25
    modifier: 1.0
    label: low
  - threshold: 0.0
    modifier: 0.0
    label: skip
hooks_file: v8_champion.py
pre_gate_hook: evaluate_v8_champion
