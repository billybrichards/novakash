name: v8_champion_cedar
version: "8.0.0-cedar"
# v8_champion_cedar — 2026-04-21 — GHOST shadow A/B variant of v8_champion.
#
# Reads the cedar LGB candidate from /v2/probability/cedar (Montreal ML box)
# instead of the prod probability stack. All v8 gate logic is identical to
# v8_champion except for two deliberately-tweaked gates to test whether a
# wider fill band + lower UP fill floor unlocks additional edge when backed
# by the cedar model:
#
#   fill_band_max: 0.82     (prod v8: 0.65) — accepts richer fills when confident
#   up_min_fill_price: 0.50 (prod v8: 0.55) — loosens UP floor
#
# Purpose (three strategies running in parallel):
#   v8_champion              — LIVE, prod model, prod gates
#   v8_champion_cedar        — GHOST, CEDAR model, tweaked gates (this file)
#   v8_champion_cedar_strict — GHOST, CEDAR model, prod gates
#
# Comparing (cedar vs cedar_strict) isolates the MODEL effect from the
# STRATEGY effect, and (cedar_strict vs v8_champion) isolates the gates.
#
# Graceful degradation: when /v2/probability/cedar is unreachable or
# probability_up_cedar is None, this strategy SKIPs with
# ``cedar_source_unavailable``. Prod v8_champion is unaffected.
#
# Rollback: edit mode: LIVE → DISABLED in this file + restart engine.
mode: LIVE
asset: BTC
timescale: 5m

# All logic is in the shared v8_champion hook. YAML-declared gates: []
# so registry's pre_gate_hook runs alone (matches v5_ensemble / v6_sniper
# pattern).
gates: []

gate_params:
  # ── Probability source (NEW — selects cedar stack) ────────────────────
  # Switches the hook to read surface.probability_up_cedar /
  # probability_lgb_cedar / probability_classifier_cedar instead of the
  # prod surface.poly_confidence stack. SKIP if any cedar field None.
  v2_probability_source: cedar

  # ── Entry window (inherit v6.1.4 tight range) ─────────────────────────
  min_offset_sec: 30
  max_offset_sec: 200

  # ── Regime (EXPANDED vs v6 — adds chop) ───────────────────────────────
  tradeable_v4_regimes: [volatile_trend, chop]

  # ── Conviction (v5_ensemble buckets, HIGH only) ───────────────────────
  require_high_conviction: true
  bucket_abs_dist_strong: 0.20
  bucket_path1_extreme_high: 0.90
  bucket_path1_extreme_low: 0.10

  # ── Fill-band (TWEAKED — wider than prod v8's 0.65) ───────────────────
  fill_band_min: 0.30
  fill_band_max: 0.82

  # ── UP asymmetric (TWEAKED — lower UP floor than prod v8's 0.55) ──────
  up_min_fill_price: 0.50
  up_require_both_buckets: true

  # ── Hour-of-day block (h00, h05, h14 UTC) ─────────────────────────────
  blocked_utc_hours: [0, 5, 14]

  # ── Source agreement (chainlink + tiingo must be present; null-block) ─
  source_agreement_require_chainlink: true
  source_agreement_require_tiingo: true
  skip_on_oracle_disagree: false

  # ── VPIN guard ────────────────────────────────────────────────────────
  vpin_min: 0.40
  vpin_max: 0.85

  # ── risk_off path — not override enabled (kept blocked via regime list)
  risk_off_override_enabled: false

  # ── Ensemble source ───────────────────────────────────────────────────
  ensemble_signal_source: ensemble
  prefer_raw_probability: true

sizing:
  type: custom
  custom_hook: clob_sizing
  fraction: 0.025            # quarter-Kelly per v8 proposal
  max_collateral_pct: 0.058  # 5.8% of bankroll per v8 proposal
  schedule:
    - { threshold: 0.55, modifier: 2.0, label: "high_conv_full" }
    - { threshold: 0.35, modifier: 1.2, label: "mid" }
    - { threshold: 0.25, modifier: 1.0, label: "low" }
    - { threshold: 0.0,  modifier: 0.0, label: "skip" }

hooks_file: v8_champion.py
pre_gate_hook: evaluate_v8_champion
