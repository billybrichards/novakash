name: v10_lgb_only
version: "10.0.0-lgb"
# v10_lgb_only — 2026-04-26 — v10 LGB model shadow strategy.
#
# Reads probability_lgb_v10 from /v4/snapshot (served by novakash-timesfm-repo
# PR #132/#133). Same gate stack as v9_lgb_only but with tuning refinements
# for v10's better calibration (ECE=0.039 vs prod 0.088).
#
# v10 model: 112 features, Optuna-tuned, 76.0% acc vs prod 70.6% on same
# test data (Apr 24-25). Trained TRADE-only on 157k rows with CoinGlass,
# TimesFM quantiles, and engineered interaction features.
#
# The hook (v10_lgb_only.py) swaps probability_lgb with probability_lgb_v10
# on the surface before delegating to v9_ensemble's gate stack, then restores
# the original value.
#
# RE-LIVE 2026-04-27 with CONSERVATIVE preset (data-driven from 40 live
# trades + 348k training rows):
#   - lgb_dist_min_up=0.15 (was 0.13) — covers conviction_floor_up=0.65
#   - lgb_dist_min_down=0.15 (was 0.10) — symmetric, kills inverted-zone
#   - eval window narrowed to T-139..T-85 (was T-240..T-45) — sweet spot
#   - half stake via max_position_usd=$3.75 — bankroll protection
#   - hedge-exit shadow on (PR #406)
# Promote to AGGRESSIVE / full stake only after 50-window validation.
mode: LIVE
asset: BTC
timescale: 5m

gates: []

gate_params:
  # ── Entry window (widened — v10 still 72.5% at T-180-240) ──────────
  # 2026-04-26 (audit #319): bumped from 24 → 45.
  # FAK ladder takes 10-25s end-to-end (RFQ poll 5s + ladder retries +
  # CLOB submit). With min_offset_sec=24, fired trades hit
  # ``eval_offset_past_close`` mid-execution because window closed
  # before the FAK could fill. 45s gives execution headroom while still
  # allowing entries up to T-240.
  # CONSERVATIVE 2026-04-27: narrowed to sweet spot T-139..T-85
  min_offset_sec: 85
  max_offset_sec: 139

  # ── Regime allowlist ────────────────────────────────────────────────
  tradeable_v4_regimes: [volatile_trend, chop, risk_off, calm_trend]

  # ── TRANSITION not blocked (v10 handles cascades at 74.4%) ─────────
  block_down_vpin_regimes: []
  block_up_vpin_regimes: []

  # ── Source agreement ────────────────────────────────────────────────
  source_agreement_require_chainlink: true
  source_agreement_require_tiingo: true
  skip_on_oracle_disagree: true

  # ── VPIN guard ──────────────────────────────────────────────────────
  vpin_min: 0.40
  vpin_max: 1.0

  # ── Fill band ───────────────────────────────────────────────────────
  fill_band_min: 0.00
  fill_band_max: 0.82
  up_min_fill_price: 0.20
  down_min_fill_price: 0.15

  # ── 24/7 trading (v10 robust across sessions) ──────────────────────
  blocked_utc_hours: []
  post_loss_cooldown_min: 20

  # ── LGB safety floor ────────────────────────────────────────────────
  # Data-driven from v10 test set threshold analysis (23,617 evals):
  #   dist>=0.10: 81.0% acc, 79% of evals — UP needs higher bar (77.3% at 0.05)
  #   dist>=0.12: UP 80.1%, DOWN 84.5% — DOWN more accurate at every threshold
  #   LOW tier (0.05-0.12) is only 60.9% acc — must not trade
  # CONSERVATIVE 2026-04-27: symmetric 0.15 (was 0.13/0.10).
  # 0.15 dist = p_up>=0.65 (covers conviction_floor_up=0.65) and
  #             p_up<=0.35 (covers conviction_floor_down=0.40).
  # Skips inverted zone p in [0.35,0.65] = WIDER than [0.50,0.60].
  lgb_dist_min_up: 0.15
  lgb_dist_min_down: 0.15
  lgb_dist_min_up_with_hc_agree: 0.08  # relaxed when HC agrees (since no classifier, rarely used)
  lgb_dist_min_down_with_hc_agree: 0.08

  # ── v9 ensemble params (kept for delegation compatibility) ─────────
  ensemble_disagreement_threshold: 0.35
  require_direction_agreement: true

  pc_weight_t_60: 0.70
  pc_weight_t_120: 0.55
  pc_weight_t_180: 0.40
  pc_weight_t_200: 0.25

  # VHC threshold: dist>=0.25 gives 90.8% acc (UP 88.2%, DOWN 93.6%)
  vhc_threshold: 0.25
  vhc_bypass_transition: true
  vhc_bypass_up_dist: true
  vhc_bypass_disagreement: true
  vhc_bypass_lgb_safety_floor: true
  vhc_bypass_oracle_direction: true
  vhc_kelly_multiplier: 2.0

  # ── PL VHC bypass ──────────────────────────────────────────────────
  # dist>=0.25 = 90.8% acc on 42% of evals — safe for bypass
  pl_vhc_bypass_enabled: true
  pl_vhc_threshold: 0.25
  pl_vhc_require_pc_agreement: true

  # ── TRANSITION strong-oracle bypass ────────────────────────────────
  # dist>=0.18 = 85.2% acc — strong enough to bypass TRANSITION block
  transition_strong_bypass_enabled: true
  transition_bypass_min_avg_pct_delta: 0.05
  transition_bypass_min_lgb_dist: 0.18

  # ── Conviction tiers (data-driven) ─────────────────────────────────
  # From threshold analysis:
  #   LOW (0.10-0.15):  83.5% acc — safe to trade
  #   MEDIUM (0.15-0.20): 83.5-86.5% — solid
  #   HIGH (0.20-0.25): 86.5-90.8% — strong
  #   VHC (>=0.25): 90.8% — very high conviction
  conviction_high_dist: 0.20
  conviction_medium_dist: 0.15
  conviction_low_dist: 0.10

  # ── Delta alignment gate ───────────────────────────────────────────
  delta_gate_enabled: true
  min_alignment_bps: 1.0

  # ── 3-tick entry confirmation ──────────────────────────────────────
  min_consecutive_pass_ticks: 3

  # ── Post-fill exit monitoring ──────────────────────────────────────
  # DISABLED 2026-04-27 — see v9 yaml for rationale (FAK-stub leak).
  # Multi-tier ladder + flip detector below remain in config but are
  # inert while exit_monitor_enabled=false. Kept for quick re-enable
  # once mergePositions-based exit replaces FAK-stub sell.
  exit_monitor_enabled: false
  exit_shadow_mode: true
  exit_eval_start_offset: 200
  exit_eval_end_offset: 30
  exit_max_retries: 1
  exit_retry_timeout_seconds: 5
  exit_mark_min_pct: 0.70
  exit_mark_ticks: 3

  # ── Multi-tier exit ladder (PR #402, 2026-04-27) ───────────────────
  # Three contiguous tiers covering T-200..T-30. See v9 yaml for full
  # rationale. Same numbers as v9 — start with one set across both
  # strategies, tune per-strategy from shadow data later.
  exit_tiers:
    - { name: tier1_early,      start_offset: 200, end_offset: 120, mark_pct: 0.50, mark_ticks: 5 }
    - { name: tier2_mid,        start_offset: 120, end_offset: 60,  mark_pct: 0.55, mark_ticks: 4 }
    - { name: tier3_aggressive, start_offset: 60,  end_offset: 30,  mark_pct: 0.70, mark_ticks: 3 }

  # ── Signal-flip detector (exit-only; reverse re-entry deferred v2) ─
  flip_enabled: true
  flip_p_threshold: 0.85
  flip_dist_threshold: 0.20
  flip_consecutive_ticks: 3
  flip_min_offset: 60
  flip_max_offset: 240
  stale_mark_max_age_seconds: 5.0

  # Legacy (disabled)
  exit_lgb_flip_enabled: false
  exit_oracle_flip_enabled: false
  exit_consecutive_flip_ticks: 5

  # ── Hedge exit (PR #X, 2026-04-27) ─────────────────────────────────
  # Buy-opposite-and-hold pattern. Replaces FAK-sell-at-stub which loses
  # ~$13/trade because Polymarket bids are $0.01 stub. Multi-signal gate
  # (LGB + chainlink + tiingo all agree opposite) for high precision.
  # Default OFF — flip on per-strategy after shadow validation.
  hedge_exit_enabled: true
  hedge_lgb_p_opposite_min: 0.85
  hedge_lgb_dist_min: 0.20
  hedge_chainlink_delta_opposite: true
  hedge_tiingo_delta_opposite: true
  hedge_consensus_consecutive_ticks: 5
  hedge_active_offset_min: 90
  hedge_active_offset_max: 200
  hedge_max_opposite_ask: 0.45
  hedge_min_guaranteed_profit_usd: 0.50
  hedge_shadow_mode: true              # log decision but don't actually buy
  hedge_max_retries: 1
  hedge_buy_timeout_seconds: 5

  # ── Primary signal source ──────────────────────────────────────────
  primary_signal_source: lgb_v10
  fallback_to_lgb_on_pc_null: true

sizing:
  type: custom
  custom_hook: clob_sizing
  fraction: 0.025
  max_collateral_pct: 0.029              # CONSERVATIVE: half of 0.058
  max_position_usd: 3.75                 # CONSERVATIVE: hard cap = half stake
  absolute_max_bet: 3.75                 # alias for max_position_usd (memory: reference_config_layering)
  # Sizing maps confidence_score (min(dist*2, 1)) to Kelly modifier.
  # Modifiers HALVED 2026-04-27 for conservative validation period.
  # Promote back to original (2.5/2.0/1.2/1.0) after 50-window clean run.
  schedule:
    - { threshold: 0.50, modifier: 1.25, label: "vhc" }       # was 2.5
    - { threshold: 0.40, modifier: 1.0,  label: "high" }      # was 2.0
    - { threshold: 0.30, modifier: 0.6,  label: "medium" }    # was 1.2
    - { threshold: 0.20, modifier: 0.5,  label: "low" }       # was 1.0
    - { threshold: 0.0,  modifier: 0.0,  label: "skip" }

hooks_file: v10_lgb_only.py
pre_gate_hook: evaluate_v10_lgb_only
