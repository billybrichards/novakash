name: v9_2_eth_raw_lgb
strategy_id: v9_2_eth_raw_lgb
version: "1.1.0"
# v9_2_eth_raw_lgb — 2026-05-20 (v1.1.0 retuned 2026-05-20 per fire-level WR sweep)
# Clean raw v9.2-style ETH 5m signal strategy.
#
# Fires purely on probability_lgb_v9_2_eth (no v9_ensemble base-gate delegation,
# no cohort gates, no sister-pair veto, no cell pauses, no blocked hours).
# Asset: ETH only. Strategy will SKIP defensively on any non-ETH surface.
#
# v1.1.0 RETUNE (2026-05-20): the original 0.85/0.20 thresholds + eval_offset 60-150
# were sourced from a tick-level WR sweep (hub note #550) which inflated WR vs
# realistic first-fire-per-window dedup. Honest first-fire WR at those thresholds
# was ~72% — below the promotion bar. Granular fire-level sweep on the same test
# split identified the highest-WR pockets at significantly tighter thresholds in
# eval_offset 120-210:
#   UP   p >= 0.96  -> 51 fires/day at 88.6% WR (just shy of 90%, best UP band)
#   DOWN p <= 0.04  -> 23 fires/day at 93.8% WR (strong)
#
# Total ~74 fires/day projected. GHOST shadow at $5 cap for safety while v1's
# thin 10-day training corpus accumulates more data. v2 corpus build is blocked
# until either (a) ETH/XRP tick collection broadens or (b) v2_scorer is
# refactored for offline replay (hub note #552).
#
# Defaults GHOST. Billy promotes manually per feedback_no_auto_promote.md.
# $5 max_position_usd for the initial shadow window.
#
# Hub notes:
#   #545 (data inventory / labelled signal availability)
#   #547 (training-pipeline spec)
#   #550 (training results + corrected WR-at-threshold tables)
#   #552 (v2 corpus feasibility — blocked, recommend GHOST v1 + organic growth)
# Companion timesfm PRs: #153 (training pipeline), #154 (ETH wiring),
# #155 (v5_feature_loader ETH path — required for emission).
# Engine precedent: feat/v9_2_post_iso_column_and_strategies (PR #555).
#
status: GHOST
description: |
  Clean raw v9.2-style ETH 5m signal strategy. Fires on probability_lgb_v9_2_eth
  alone: UP at p >= 0.96, DOWN at p <= 0.04, within eval_offset [120, 210],
  any single qualifying tick. ETH-only (defensive asset guard). No v9_ensemble
  delegation, no cohort gates, no veto layers, no cell pauses, no blocked hours.
  GHOST mode, $5 max_position_usd for the initial shadow window.
  Projected fire rate ~74 fires/day (51 UP at 88.6% WR + 23 DOWN at 93.8% WR).
mode: GHOST
asset: ETH
timescale: 5m

hooks_file: v9_2_eth_raw_lgb.py
pre_gate_hook: evaluate_v9_2_eth_raw_lgb

sizing:
  type: kelly
  fraction: 0.025
  max_collateral_pct: 0.025

gates:
  - type: chainlink_freshness

gate_params:
  up_threshold: 0.96
  down_threshold: 0.04
  eval_offset_min: 120
  eval_offset_max: 210
  min_consecutive_pass_ticks: 1
  expected_asset: ETH
  entry_cap: 0.85
  collateral_pct: 0.025
  gtc_cap: 0.90

risk:
  max_position_usd: 5
  max_daily_loss_usd: 20
