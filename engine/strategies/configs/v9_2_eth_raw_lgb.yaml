name: v9_2_eth_raw_lgb
strategy_id: v9_2_eth_raw_lgb
version: "1.0.0"
# v9_2_eth_raw_lgb — 2026-05-20 — clean raw v9.2-style ETH 5m signal strategy.
#
# Fires purely on probability_lgb_v9_2_eth (no v9_ensemble base-gate delegation,
# no cohort gates, no sister-pair veto, no cell pauses, no blocked hours).
# Asset: ETH only. Strategy will SKIP defensively on any non-ETH surface.
#
# Criteria (hub note #550, ETH/XRP v1 corrected WR-at-threshold table):
#   UP   when probability_lgb_v9_2_eth >= 0.85  -> projected WR ~92-94% on test
#   DOWN when probability_lgb_v9_2_eth <= 0.20  -> projected WR ~92-94% on test
#   eval_offset between 60 and 150              -> T-60 to T-150
#                                                  (drops weak δ=180 vs BTC's 60-210)
#   one qualifying tick is enough               -> no N-of-M cohort gate
#
# Defaults GHOST. Billy promotes manually per feedback_no_auto_promote.md.
# $5 max_position_usd for the initial shadow window.
#
# Hub notes:
#   #545 (data inventory / labelled signal availability)
#   #547 (training-pipeline spec)
#   #550 (training results + corrected WR-at-threshold tables)
# Companion timesfm PR: bg-agent-1 v9.2 ETH/XRP training pipeline.
# Engine precedent: feat/v9_2_post_iso_column_and_strategies (PR #555).
#
status: GHOST
description: |
  Clean raw v9.2-style ETH 5m signal strategy. Fires on probability_lgb_v9_2_eth
  alone: UP at p >= 0.85, DOWN at p <= 0.20, within eval_offset [60, 150],
  any single qualifying tick. ETH-only (defensive asset guard). No v9_ensemble
  delegation, no cohort gates, no veto layers, no cell pauses, no blocked hours.
  GHOST mode, $5 max_position_usd for the initial shadow window.
mode: GHOST
asset: ETH
timescale: 5m

hooks_file: v9_2_eth_raw_lgb.py
pre_gate_hook: evaluate_v9_2_eth_raw_lgb

sizing:
  type: kelly
  fraction: 0.025
  max_collateral_pct: 0.025

gates:
  - type: chainlink_freshness

gate_params:
  up_threshold: 0.85
  down_threshold: 0.20
  eval_offset_min: 60
  eval_offset_max: 150
  min_consecutive_pass_ticks: 1
  expected_asset: ETH

risk:
  max_position_usd: 5
  max_daily_loss_usd: 20
