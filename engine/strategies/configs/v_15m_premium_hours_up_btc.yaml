name: v_15m_premium_hours_up_btc
version: "1.0.0"
mode: GHOST
asset: BTC
timescale: 15m

# Trades only in BTC 15m premium hours (sweep 2b: hours 3, 5, 15, 17, 19, 21
# have >=65% WR). Single-model conviction via consensus(min_votes=1).
# Lighter gate stack — designed to capture the high-WR hours with
# moderate conviction.

gates:
  - type: timing
    params: { min_offset: 180, max_offset: 540 }
  - type: direction
    params: { direction: UP }
  - type: session_hours
    params: { hours_utc: [3, 5, 15, 17, 19, 21] }
  - type: multi_model_consensus
    params:
      models: [v9_1, v9, v12]
      direction: UP
      min_votes: 1
      vote_threshold_up: 0.60
  - type: regime_v4
    params: { allow: [volatile_trend, chop, risk_off] }
  # Safety gates added 2026-05-04 (PR: feat/add-safety-gates-strict-strategies)
  # to close the strict-gate-list oracle/fill_band/vpin safety gap.
  - type: oracle_direction
    params: { direction: UP }
  - type: vpin_gate
    params: { min: 0.40, block_cascade: true }
  - type: fill_band
    params: { direction: UP, min_fill_price: 0.20, max_fill_price: 0.82 }
  - type: consecutive_pass_ticks
    params: { min_ticks: 12 }

sizing:
  type: fixed_kelly
  fraction: 0.025
  max_collateral_pct: 0.05
