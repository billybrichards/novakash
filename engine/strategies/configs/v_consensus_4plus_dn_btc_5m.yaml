name: v_consensus_4plus_dn_btc_5m
version: "1.0.0"
mode: GHOST
asset: BTC
timescale: 5m

# Data-backed: sweep 11 — 4-of-5 DOWN → 91.7% WR (n=24, rare but strong).
# Higher fraction (0.030) reflects the higher conviction.

gates:
  - type: timing
    params: { min_offset: 30, max_offset: 120 }
  - type: direction
    params: { direction: DOWN }
  - type: multi_model_consensus
    params:
      models: [v9, v9_1, v10, v12, classifier]
      direction: DOWN
      min_votes: 4
      vote_threshold_dn: 0.45
  - type: regime_v4
    params: { allow: [volatile_trend, chop, risk_off] }
  - type: model_disagreement_veto
    params: { primary: v9, secondary: v12, max_abs_diff: 0.20 }
  - type: consecutive_pass_ticks
    params: { min_ticks: 10 }

sizing:
  type: fixed_kelly
  fraction: 0.030
  max_collateral_pct: 0.05
