name: v_v9_1_strong_up_btc_5m
version: "1.0.0"
mode: GHOST
asset: BTC
timescale: 5m

# Mirror of v_v9_strong_up_btc_5m, anchored on v9.1 (priceToBeat-aligned
# retrain, +5.92pp lift over v9 PROD per training stats).
# A/B comparison after 7d ghost decides which becomes LIVE.
# Thresholds carry from v9 sweep 4 priors until v9.1 has its own n>=200.

gates:
  - type: timing
    params: { min_offset: 30, max_offset: 120 }
  - type: direction
    params: { direction: UP }
  - type: multi_model_consensus
    params:
      models: [v9_1]
      direction: UP
      min_votes: 1
      vote_threshold_up: 0.65
  - type: regime_v4
    params: { allow: [volatile_trend, chop, risk_off] }
  - type: model_disagreement_veto
    params: { primary: v9_1, secondary: v12, max_abs_diff: 0.20 }
  # Safety gates added 2026-05-04 (PR: feat/add-safety-gates-strict-strategies)
  # — this strategy fired through the 10:55 UTC oracle flip and lost real
  # money. Mirrors v9_ensemble's safety net.
  - type: oracle_direction
    params: { direction: UP }
  - type: vpin_gate
    params: { min: 0.40, block_cascade: true }
  - type: fill_band
    params: { direction: UP, min_fill_price: 0.20, max_fill_price: 0.82 }
  - type: consecutive_pass_ticks
    params: { min_ticks: 10 }

sizing:
  type: fixed_kelly
  fraction: 0.025
  max_collateral_pct: 0.05
