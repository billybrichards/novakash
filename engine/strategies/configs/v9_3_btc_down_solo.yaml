name: v9_3_btc_down_solo
strategy_id: v9_3_btc_down_solo
version: "2.0.0"
# v9_3_btc_down_solo — 2026-05-25 (GHOST, Billy promotes manually)
# v2.0.0 — COLUMN SWITCH: probability_lgb_v9_3_btc (BLEND) → probability_lgb_v9_3_btc_pure (PURE)
#           THRESHOLD TIGHTENED: 0.50 → 0.20 (= DOWN @ 0.80 confidence per v9.3.1 OOF)
#
# DOWN-only BTC 5m strategy reading probability_lgb_v9_3_btc_pure (PURE column).
# Fires DOWN at p <= 0.20, within eval_offset [60, 180].
# NO UP side — covered by companion v9_3_btc_pure_up_solo (p >= 0.85, 94.3% WR).
#
# COLUMN PROVENANCE (data_surface.py line 349):
#   probability_lgb_v9_3_btc_pure = PURE LGB+iso output BEFORE the blend_ensemble
#   step in app/v2_scorer.py. The original BLEND column (probability_lgb_v9_3_btc)
#   is capped at ~0.916 due to TimesFM HF classifier saturation; the PURE column
#   reaches the full 0-1 range. This strategy now reads PURE directly to benefit
#   from the stronger OOF signal confirmed by v9.3.1 retrain (468K OOF records).
#
# MIGRATION from v1.0.0 (BLEND-based):
#   v1.0.0 read probability_lgb_v9_3_btc at p <= 0.50 (83.3% WR n=18 — single day).
#   v2.0.0 reads probability_lgb_v9_3_btc_pure at p <= 0.20 (87.0% WR n=130K OOF).
#   The PURE OOF data is 4+ orders of magnitude larger and much more reliable.
#   Threshold tightening (0.50 → 0.20) reflects the fact that the PURE column
#   occupies a different probability space to the BLEND column; the DOWN @ p <= 0.20
#   PURE pocket is equivalent to DOWN @ 0.80 confidence in the v9.3.1 OOF.
#
# THRESHOLD RATIONALE (v9.3.1 overnight OOF retrain, 468K records, 2026-05-25):
#   probability_lgb_v9_3_btc_pure OOF results:
#     DOWN p <= 0.20 (= 0.80 conf): 87.0% WR  n=130K
#     DOWN p <= 0.15 (= 0.85 conf): 92.7% WR  n=83K
#     DOWN p <= 0.10 (= 0.90 conf): 94.2% WR  n=63K
#   Threshold set at p <= 0.20 (primary) for fire rate vs precision balance.
#   Billy can tighten to p <= 0.15 or p <= 0.10 via strategy_runtime_overrides.
#
# WHY DOWN-ONLY?
#   The UP side of the v9.3.1 PURE OOF is covered by companion strategy
#   v9_3_btc_pure_up_solo (p >= 0.85, 94.3% WR n=90K). Both strategies read
#   the same PURE column but fire in opposite directions with no threshold overlap
#   (DOWN fires at p <= 0.20; UP fires at p >= 0.85) — no market conflict.
#
# EVAL_OFFSET BAND (2026-05-25 sweep, RDS note #694):
#   [60, 180] — consistent with v9_2_eth_solo's best band. Avoids the weak Δ=240s tail.
#
# FILL-BAND GATES (RDS note #664, 2026-05-25):
#   entry_floor_up: 0.65 — present in YAML but unused (no UP fires).
#   entry_cap_down: 0.90 — skip DOWN/NO fires where YES fill >= 0.90.
#
# RISK / SHADOW SOAK PLAN:
#   max_position_usd=5 to start — shadow soak until 20+ GHOST fires.
#   If 20+ GHOST DOWN WR >= 84%, promote to LIVE at $5.
#   If DOWN WR < 78% after 30+ GHOST fires, kill or tighten to p <= 0.15.
#
# References:
#   v9.3.1 OOF retrain (2026-05-25) — 468K records, DOWN p<=0.20 = 87.0% WR n=130K
#   data_surface.py line 349 — probability_lgb_v9_3_btc_pure definition
#   Sibling strategy: v9_3_btc_pure_up_solo (UP p>=0.85, 94.3% WR n=90K)
#   v9_3_btc_pure_lgb:       UP p>=0.935 / DOWN p<=0.065 (tight, high-WR OOF)
#   RDS note #694 — original threshold sweep (2026-05-25)
#
status: GHOST
description: |
  DOWN-only BTC 5m strategy reading probability_lgb_v9_3_btc_pure (PURE column,
  data_surface.py line 349). v2.0.0 — migrated from BLEND column + threshold
  tightened from 0.50 to 0.20 (= DOWN @ 0.80 confidence per v9.3.1 OOF retrain,
  468K records). DOWN at p <= 0.20 -> 87.0% WR n=130K OOF. NO UP side —
  covered by companion v9_3_btc_pure_up_solo. Direction-aware fill gate:
  DOWN cap 0.90. GHOST mode, $5 max_position_usd.
mode: GHOST
asset: BTC
timescale: 5m

hooks_file: v9_3_btc_down_solo.py
pre_gate_hook: evaluate_v9_3_btc_down_solo

sizing:
  type: kelly
  fraction: 0.025
  max_collateral_pct: 0.025

gates:
  - type: chainlink_freshness

gate_params:
  down_threshold: 0.20         # v9.3.1 OOF: DOWN p<=0.20 = 87.0% WR n=130K; tighten to 0.15 (92.7%) or 0.10 (94.2%) via runtime_overrides
  eval_offset_min: 60          # best band consistent with v9_2_eth_solo sweep
  eval_offset_max: 180
  min_consecutive_pass_ticks: 2  # extra confirmation tick (conservative for PURE column migration)
  expected_asset: BTC
  entry_cap: 0.90              # cap fill at 0.90 per Billy "max bet 0.9"
  entry_floor_up: 0.65         # present but unused — no UP fires in this strategy
  entry_cap_down: 0.90         # skip DOWN/NO fires if YES fill >= 0.90 (RDS #664)
  collateral_pct: 0.025
  gtc_cap: 0.96

risk:
  max_position_usd: 5          # START LOW — shadow soak before any promotion
  max_daily_loss_usd: 20
