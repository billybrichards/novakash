name: v9_cascade_fade_early
version: "1.0.0-ghost"
# v9_cascade_fade_early — 2026-05-01 — CASCADE×DOWN fade specialist (first
# minute of window, low-conviction v9 LGB).
#
# Thesis (Hub note #305 — v9 LGB pure-signal alpha analysis, 87h shadow):
#   v9 LGB at CASCADE × DOWN × T-181-240 × dist[0.10-0.20] × k=1
#   = +$104 n=102 65.7% WR.
#
# Anti-correlation pattern: in CASCADE×DOWN, low v9 conviction (dist 0.10-0.20)
# is the alpha — extreme conviction (dist >= 0.30) is anti-predictive (37% WR
# vs 79% at 0.10-0.15). High conviction collapses because the engine reads the
# same crash signal everyone else does at peak fear; the contrarian alpha sits
# in the hesitant-but-correct zone.
#
# 3-tick confirmation HURTS this specific cell (k=1 +$110 vs k=3 -$29). Cascade
# alpha decays fast — by the time the engine confirms 3 ticks, the contrarian
# fill has moved away. Use k=1.
#
# Direction lock: up_min_fill_price=1.01 (NOT VHC-bypassable per
# v9_ensemble.py:1121-1144 comment). Any UP attempt fails fill_floor and
# SKIPs cleanly. block_down_vpin_regimes is also set as a regime guard but
# is bypassable by VHC — the fill-floor is the hard lock.
#
# T-band: min_offset_sec=181, max_offset_sec=240 = sec-to-close 181-240
# = first minute of window (window opens at sec-since-open 0; T-181-240
# means 181-240 seconds remain → 60-119s after open). See memory
# reference_eval_offset_verified.md.
#
# GHOST mode. DO NOT promote without:
#   1. >=7 days shadow data
#   2. WR > 65% on n > 30 real trades
#   3. Net positive in real PnL (not DB pnl_usd — see feedback_payoff_math.md)
#   4. Billy explicit sign-off (per feedback_no_auto_model_promotion.md)
#
# CONSTRAINT (no-code-yet): the hook does NOT block dist >= 0.30 anti-predictive
# band — engine has no `lgb_dist_max` param today. If shadow shows the high-dist
# tail bleeding, add an `lgb_dist_max_down` gate to v9_ensemble in a separate PR
# and wire here. Until then, exit_monitor + post_loss_cooldown are the only
# guards on the bleed band.
mode: GHOST
asset: BTC
timescale: 5m

gates: []

gate_params:
  # ── Entry window (first minute of window — CASCADE alpha decays fast) ───
  # eval_offset = SECONDS-TO-CLOSE (T-minus). T-181-240 = first minute
  # after window open. Verified via real fires — see memory
  # reference_eval_offset_verified.md.
  min_offset_sec: 181
  max_offset_sec: 240

  # ── Regime allowlist (CASCADE happens in volatile/risk-off conditions) ──
  tradeable_v4_regimes: [risk_off, volatile_trend]

  # ── VPIN-regime gate: only CASCADE allowed for DOWN ─────────────────────
  # Bypassable by VHC if a strong-oracle bypass kicks in — but the
  # up_min_fill_price=1.01 below makes UP impossible regardless, so
  # this is direction + regime confluence. CASCADE is ~5-10% of windows.
  block_down_vpin_regimes: [TRANSITION, CALM, NORMAL, NORMAL_TREND, LOW_VOL]
  block_up_vpin_regimes: []  # UP impossible via fill-floor anyway

  # ── HARD DOWN-only lock (NOT VHC-bypassable) ────────────────────────────
  # See v9_ensemble.py:1121-1144 — up_fill_floor is enforced AFTER all VHC
  # bypasses. up_min_fill_price=1.01 = no real UP fill can ever pass.
  up_min_fill_price: 1.01
  down_min_fill_price: 0.15

  # ── Fill band ───────────────────────────────────────────────────────────
  fill_band_min: 0.00
  fill_band_max: 0.82

  # ── Source agreement ────────────────────────────────────────────────────
  source_agreement_require_chainlink: true
  source_agreement_require_tiingo: true
  skip_on_oracle_disagree: true

  # ── VPIN guard ──────────────────────────────────────────────────────────
  vpin_min: 0.40
  vpin_max: 1.0

  # ── Conviction floor (LOW is the alpha — DO NOT raise) ──────────────────
  # In CASCADE×DOWN: dist[0.10-0.15]=79% WR n=43; dist[0.15-0.20]=64% n=28;
  # dist>=0.30=37% (anti-predictive). 0.10 floor catches the alpha pocket.
  # Per memory feedback_override_keys.md: must use per-direction keys.
  lgb_dist_min_down: 0.10
  lgb_dist_min_up: 1.01            # belt-and-braces — no UP path

  # Disable HC-agree relaxations (LGB-only mode below)
  lgb_dist_min_down_with_hc_agree: 0.10
  lgb_dist_min_up_with_hc_agree: 1.01

  # ── Tick confirmation (k=1 — cascade alpha decays fast) ────────────────
  # Per Hub note #305: k=3 swings this cell from +$110 → -$29.
  min_consecutive_pass_ticks: 1

  # ── 24/7 trading ────────────────────────────────────────────────────────
  blocked_utc_hours: []
  post_loss_cooldown_min: 30      # extra cooldown — cascade losses cluster

  # ── v9 ensemble params (delegation compatibility) ───────────────────────
  ensemble_disagreement_threshold: 0.35
  require_direction_agreement: false  # LGB-only — no classifier to disagree

  pc_weight_t_60: 0.0     # neutered — LGB-only mode
  pc_weight_t_120: 0.0
  pc_weight_t_180: 0.0
  pc_weight_t_200: 0.0

  # ── VHC bypass — DISABLED for this strategy ─────────────────────────────
  # The whole alpha is LOW conviction. VHC paths assume HIGH conviction is
  # safer and bypass tighter checks — opposite of what we want.
  vhc_threshold: 1.01            # impossible threshold = VHC never triggers
  vhc_bypass_transition: false
  vhc_bypass_up_dist: false
  vhc_bypass_disagreement: false
  vhc_bypass_lgb_safety_floor: false
  vhc_bypass_oracle_direction: false
  vhc_kelly_multiplier: 1.0

  # ── PL VHC bypass — DISABLED ───────────────────────────────────────────
  pl_vhc_bypass_enabled: false
  pl_vhc_threshold: 1.01
  pl_vhc_require_pc_agreement: true

  # ── TRANSITION strong-oracle bypass — DISABLED ─────────────────────────
  # We explicitly DO NOT want TRANSITION trades — block_down_vpin_regimes
  # excludes it.
  transition_strong_bypass_enabled: false
  transition_bypass_min_avg_pct_delta: 1.0
  transition_bypass_min_lgb_dist: 1.01

  # ── Conviction tiers (informational — sizing reads min_dist via score) ─
  conviction_high_dist: 0.20
  conviction_medium_dist: 0.15
  conviction_low_dist: 0.10

  # ── Delta alignment gate ────────────────────────────────────────────────
  delta_gate_enabled: true
  min_alignment_bps: 1.0

  # ── Exit monitoring ─────────────────────────────────────────────────────
  exit_monitor_enabled: true
  exit_shadow_mode: true
  exit_eval_start_offset: 200
  exit_eval_end_offset: 30
  exit_max_retries: 1
  exit_retry_timeout_seconds: 5
  exit_mark_min_pct: 0.50
  exit_mark_ticks: 5

  # Legacy (disabled)
  exit_lgb_flip_enabled: false
  exit_oracle_flip_enabled: false
  exit_consecutive_flip_ticks: 5

  # ── Primary signal source ──────────────────────────────────────────────
  primary_signal_source: lgb_v9_cascade_fade
  fallback_to_lgb_on_pc_null: true

sizing:
  # Half v12_combo cap ($7.50 → $5.00). Kelly 0.025 baseline (was 0.04 on
  # v12_combo). Smaller bet because LOW-conviction alpha has fat-tail risk
  # — cap downside until 7d ghost confirms.
  type: custom
  custom_hook: clob_sizing
  fraction: 0.025
  max_collateral_pct: 0.05         # ≈$5 cap on ~$108 wallet
  schedule:
    # confidence_score = min(dist*2, 1) — same as v10_lgb_only.
    # We want dist=0.10-0.20 to size ~1x, NOT scale up at high dist.
    - { threshold: 0.40, modifier: 1.0,  label: "anti_high_dist" }  # dist>=0.20: cap at 1x (anti-predictive zone)
    - { threshold: 0.30, modifier: 1.0,  label: "medium" }          # dist>=0.15
    - { threshold: 0.20, modifier: 1.0,  label: "low_alpha" }       # dist>=0.10 — alpha pocket
    - { threshold: 0.0,  modifier: 0.0,  label: "skip" }

hooks_file: v9_cascade_fade_early.py
pre_gate_hook: evaluate_v9_cascade_fade_early
