name: tickformer_v17_sniper
strategy_id: tickformer_v17_sniper
version: "1.0.0"
# tickformer_v17_sniper — 2026-05-28 (SHADOW, Billy promotes manually)
#
# TickFormer v17 precision-sniper SHADOW strategy. Reads the NEW column
# emitted by timesfm-service (sister PR on the magic-model repo):
#   probability_tickformer_v17 (NUMERIC)
# plus the shared tickformer_trade_signal field (already added by v16 PR).
#
# THE SNIPER PROFILE:
#   v17 is v16's precision-tuned successor — same hybrid transformer +
#   multi-step autoregressive head but with the loss reweighted toward
#   late-window precision. Trade-off vs v16: ~10x fewer fires for ~3-4pp
#   higher WR across the full t-60..t-220 band.
#
# HEADLINE CONVICTION TIERS (v17 val sweep):
#   thr 0.85, eval_offset_remaining 60s   -> ~98% WR (very low volume)
#   thr 0.85, eval_offset_remaining 140s  -> ~94% WR
#   thr 0.85, eval_offset_remaining 220s  -> ~92% WR
#
# Defaults below: thr 0.85, remaining 60-140 (the sniper sweet spot).
# Widen rem_max to 220 in YAML for dream-tier shadow telemetry.
#
# DOWN SIDE: symmetric. down_threshold defaults to 1 - up_threshold.
# Trade-signal cross-check blocks only on explicit opposite.
#
# SHADOW KILL SWITCH:
#   gate_params.shadow_only=1 (default) forces SKIP-with-decision-record
#   behaviour even if mode=LIVE in YAML. Must be flipped to 0 in YAML
#   before any real fire emits. This is the single explicit go-live gate.
#
# GATE STATE:
#   - chainlink_freshness only — final-mile execution filter.
#   - No cohort gates, no sister-pair veto, no v9_ensemble base delegation.
#     The magic-model edge is independent of the LGB stack.
#
# ROLLOUT PLAN:
#   1. SHADOW (this PR). Sniper band defaults, shadow_only=1.
#   2. After 20+ shadow fires with WR >= 95% across both directions
#      (sniper density is lower — 50-fire bar would take a week),
#      flip shadow_only=0 and promote to GHOST.
#   3. After 50+ GHOST fires sustaining 95%+ WR, promote to LIVE with
#      max_position_usd=5.
#
# DEPENDENCY:
#   timesfm sister PR adds probability_tickformer_v17 column to
#   signal_evaluations + emits it on /v4/snapshot.timescales.5m. This
#   engine PR is forward-compatible: probability_tickformer_v17=None
#   short-circuits to a clean SKIP (tickformer_v17_not_available) until
#   the timesfm-side flag flips.
#
# References:
#   docs/STRATEGY_tickformer_v17_sniper.md — design doc + tier table
#   Sibling engine strategy: tickformer_v16_pure (sister magic-model strategy)
#
status: SHADOW
description: |
  TickFormer v17 precision-sniper SHADOW strategy. Reads
  probability_tickformer_v17 (NUMERIC) emitted by timesfm-service.
  RECAL 2026-05-28: thr lowered 0.85→0.65 (live max 0.752; zero crosses
  at 0.85 in 24h). Clean live pockets: 0.65-0.69×120-179s=100% WR n=13,
  0.70-0.74×60-119s=100% WR n=15. Band: 60-179s (was 60-140).
  shadow_only=1 forces SKIP-with-record. Symmetric DOWN side p<=0.35.
mode: SHADOW
asset: ANY
timescale: 5m

hooks_file: tickformer_v17_sniper.py
pre_gate_hook: evaluate_tickformer_v17_sniper

sizing:
  type: kelly
  fraction: 0.025
  max_collateral_pct: 0.025

gates:
  - type: chainlink_freshness

gate_params:
  shadow_only: 1                       # 1=SKIP-with-record, 0=allow TRADE
  mutex_group: tickformer              # cross-strategy guardrail (PR #619 FIX 2)
  # ── RECAL 2026-05-28 (fix/tickformer-threshold-recal-2026-05-28) ──────
  # Live 7d BTC 5m sweep (189 resolved windows, hub notes #728/#729):
  #   prob 0.65-0.69 × eval_offset_remaining 120-179s → n=13, WR 100%
  #   prob 0.70-0.74 × eval_offset_remaining 60-119s  → n=15, WR 100%
  # Previous threshold 0.85 was unreachable in live data (max 0.752 in 24h,
  # zero crosses observed). Targeting v17's clean pocket: 0.65+ / 60-179s.
  # Env flag TICKFORMER_RECAL_2026_05_28=true enables the new values below.
  up_threshold: 0.65                   # RECAL: was 0.85; live pocket starts at 0.65 (100% WR @ 60-179s)
  down_threshold: 0.35                 # symmetric: 1 - 0.65 = 0.35
  eval_offset_remaining_min: 60        # seconds remaining — v17 clean pocket floor
  eval_offset_remaining_max: 179       # RECAL: was 140; v17 clean pocket ceiling (60-179s band)
  min_consecutive_pass_ticks: 1
  entry_cap: 0.93
  entry_floor_up: 0.60                 # skip UP fires if fill < 0.60 (RDS #664)
  entry_cap_down: 0.90                 # skip DOWN fires if fill > 0.90
  collateral_pct: 0.025
  gtc_cap: 0.96

risk:
  max_position_usd: 5                  # SHADOW — no real fire while shadow_only=1
  max_daily_loss_usd: 20
