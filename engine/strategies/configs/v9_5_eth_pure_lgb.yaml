name: v9_5_eth_pure_lgb
strategy_id: v9_5_eth_pure_lgb
version: "1.0.0"
# v9_5_eth_pure_lgb — 2026-05-24 (Billy approved)
#
# ETH 5m PURE-LGB strategy. Reads the NEW `probability_lgb_v9_5_eth_pure`
# column (no TimesFM HF classifier blend) emitted by the v9.5 ETH booster +
# isotonic calibrator directly. The LIVE blend path (app/v2_scorer.py:
# blend_ensemble) caps probabilities at ~0.92 because the classifier
# saturates at ~0.84 — see RDS notes #631, #632 (the "blend bug" discovery).
# This PURE column persists the LGB+iso output unmodified, so we can trade
# the model's own calibration directly without losing the high-conviction
# tail.
#
# Companion blend strategy (renamed in this same PR):
#   v9_5_eth_blend  (née v9_5_eth_raw_lgb — reads the blended column at the
#                    tighter 0.96/0.04 operating point)
#
# Walk-forward CV (5×4d, 16d OOF, 22.66d corpus, 67-feature schema):
#   UP   p ≥ 0.915 → 90.3% WR (n=1330, Wilson LB 88.6%), ~83.1 fires/day
#   DOWN p ≤ 0.095 → 90.4% WR (n=1416, Wilson LB 88.7%), ~88.5 fires/day
# That is ~10× more fires than the blend at the same 90% WR target —
# unlocking the v9.5 calibrated head's true capacity.
#
# Per-Δ breakdown at p ≥ 0.915 UP:
#   Δ=30-90s: WR 96.8-98.1% on n=604-1031  (high-precision early ticks)
#   Δ=120s:   WR 92.4% on n=669             (still solid)
#   Δ=180s:   WR 95.6% on n=113
#   Δ=240s:   WR 82.1% on n=280             (weak tail — bounded by
#                                            eval_offset_max=210 below)
# Similar shape DOWN @ p ≤ 0.095 — Δ=240s is the only side-of-band weak
# point. eval_offset_max=210 drops it; the 60-210 band keeps ~94% of fires
# at materially higher WR.
#
# Asset: ETH only. Strategy will SKIP defensively on any non-ETH surface (the
# v9.5 ETH model is calibrated for ETH only).
#
# Defaults GHOST per feedback_no_auto_promote.md (post-2026-04-17 rule —
# Billy promotes manually). $5 max_position_usd for the initial shadow
# window; raise once GHOST soak confirms the CV numbers.
#
# DEPENDENCIES (all required before this strategy can contribute non-NULL
# probability_lgb_v9_5_eth_pure on the surface):
#   1. timesfm-service: emit probability_lgb_v9_5_eth_pure on
#      /v4/snapshot.timescales.5m when the per-asset PURE emission flag is on
#   2. engine data_surface.py: probability_lgb_v9_5_eth_pure field (added
#      this PR)
#   3. migrations/add_probability_lgb_v9_5_eth_pure.sql applied to prod DB
#   4. engine signal-writer hooked up (added this PR)
#
# References:
#   - RDS notes #631, #632 — blend bug discovery (classifier saturation caps
#     v9.5 probabilities at ~0.92).
#   - Walk-forward CV results: /tmp/v9_5_eth_walkforward_results.md.
#   - Sibling timesfm PR: feat/v9_5_eth_pure_emission (forthcoming).
#   - Engine precedent: configs/v9_5_eth_raw_lgb.yaml (the blend variant,
#     about to be renamed v9_5_eth_blend in this same PR).
#
status: GHOST
description: |
  PURE LGB+iso v9.5 ETH 5m strategy. Reads probability_lgb_v9_5_eth_pure
  (the un-blended LGB+iso output — sibling to the LIVE blended
  probability_lgb_v9_5_eth column that's capped at ~0.92 by classifier
  saturation per RDS notes #631/#632). Fires UP at p ≥ 0.915, DOWN at
  p ≤ 0.095, within eval_offset [60, 210] (drops the weak Δ=240s tail),
  any single qualifying tick. ETH-only (defensive asset guard).
  Walk-forward CV (5×4d, 16d OOF): UP 90.3% WR Wilson LB 88.6% @ ~83/day,
  DOWN 90.4% WR Wilson LB 88.7% @ ~89/day. ~10× more fires than the
  blend variant at the same 90% WR target. GHOST mode, $5
  max_position_usd for the initial shadow window. Companion blend
  strategy: v9_5_eth_blend (formerly v9_5_eth_raw_lgb).
mode: GHOST
asset: ETH
timescale: 5m

hooks_file: v9_5_eth_pure_lgb.py
pre_gate_hook: evaluate_v9_5_eth_pure_lgb

sizing:
  type: kelly
  fraction: 0.025
  max_collateral_pct: 0.025

gates:
  - type: chainlink_freshness

gate_params:
  up_threshold: 0.915
  down_threshold: 0.095
  eval_offset_min: 60
  eval_offset_max: 210
  min_consecutive_pass_ticks: 1
  expected_asset: ETH
  entry_cap: 0.93
  collateral_pct: 0.025
  gtc_cap: 0.96

risk:
  max_position_usd: 5
  max_daily_loss_usd: 20
