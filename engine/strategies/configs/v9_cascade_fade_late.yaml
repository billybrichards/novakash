name: v9_cascade_fade_late
version: "9.0.0-cascade-fade-late"
# v9_cascade_fade_late — 2026-05-02 — DOWN-only CASCADE-fade specialist at LAST minute of window.
#
# Walk-forward validation: 3/4 folds passed across 30d real-trade data.
# n=88 trades, 82.8% WR, +$32 (Track 4 of Hub note #312 framework, results in #314 + #315).
#
# Critically: the validated pocket is `eval_offset 0-60` (sec-to-close 0-60 = last minute
# of window). The earlier `v9_cascade_fade_early` strategy was configured at `eval_offset
# 181-240` (first minute) which FAILED walk-forward — that pocket was a 87h artifact.
#
# Direction lock via `up_min_fill_price=1.01` (NOT VHC-bypassable per code comment in
# v9_ensemble.py:1121-1196). Conviction is INVERSE in CASCADE×DOWN: dist[0.10-0.15] = 79%
# WR while dist >= 0.30 = 37% WR (anti-predictive). Use LOW conviction band only.
#
# Tick confirm: k=1 (CASCADE alpha decays fast — k=3 hurts $140/cell swing per
# memory feedback_counterfactual_challenges.md).
#
# Block UTC hours [2-8, 15-16] — Asian UP / late-Asian hours where UP bleeds heavily
# (-$3,113 over 30d in those hours per Track 6). Defensive: even though this is
# DOWN-only, blocking those hours adds margin.
#
# Default mode GHOST. Promotion to LIVE via Hub runtime override after Billy review.
# Ref: feedback_no_auto_model_promotion.md, project_alpha_extraction_results_2026_05_02.md.

mode: GHOST
asset: BTC
timescale: 5m

gates: []
pre_gate_hook: evaluate_v9_cascade_fade_late

gate_params:
  # T-band — LAST minute of window (validated by walk-forward 3/4)
  min_offset_sec: 24
  max_offset_sec: 60

  # Direction lock — DOWN only
  up_min_fill_price: 1.01
  down_min_fill_price: 0.15

  # vpin gate — CASCADE only
  block_down_vpin_regimes: [TRANSITION, CALM, NORMAL, NORMAL_TREND, LOW_VOL]
  block_up_vpin_regimes: [CASCADE, TRANSITION, CALM, NORMAL, NORMAL_TREND, LOW_VOL]

  # Conviction — LOW band (inverse-conviction confirmed in CASCADE×DOWN)
  lgb_dist_min_down: 0.10
  lgb_dist_min_up: 1.01

  # Tick confirm — k=1 (CASCADE alpha decays fast)
  min_consecutive_pass_ticks: 1

  # Time-of-day defensive
  blocked_utc_hours: [2, 3, 4, 5, 6, 7, 8, 15, 16]

  # Regime allowlist
  tradeable_v4_regimes: [risk_off, volatile_trend]

  # Source agreement (per v8_champion proven pattern)
  source_agreement_require_chainlink: true
  source_agreement_require_tiingo: true
  skip_on_oracle_disagree: true

  # VPIN guard
  vpin_min: 0.40
  vpin_max: 1.0

  # Fill band
  fill_band_min: 0.05
  fill_band_max: 0.78

  # Cooldown
  post_loss_cooldown_min: 30

  # LGB safety floor
  lgb_dist_min_down_with_hc_agree: 0.08
  lgb_dist_min_up_with_hc_agree: 1.01

  # Ensemble params (delegation compatibility)
  ensemble_disagreement_threshold: 0.35
  require_direction_agreement: false   # single-signal v9, no agreement required

  # VHC threshold (don't bypass DOWN-only direction lock)
  vhc_threshold: 0.25
  vhc_bypass_transition: false
  vhc_bypass_up_dist: false
  vhc_bypass_disagreement: false
  vhc_bypass_lgb_safety_floor: false
  vhc_bypass_oracle_direction: false
  vhc_kelly_multiplier: 1.0

sizing:
  type: kelly
  fraction: 0.025
  max_collateral_pct: 0.025
