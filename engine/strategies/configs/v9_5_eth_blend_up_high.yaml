name: v9_5_eth_blend_up_high
strategy_id: v9_5_eth_blend_up_high
version: "1.0.0"
# v9_5_eth_blend_up_high — 2026-05-24 — UP-HIGH ceiling tier of the v9.5
# ETH BLEND ladder. See v9_5_eth_blend_up_low.yaml for ladder overview.
#
# BAND SEMANTICS: fire if probability_lgb_v9_5_eth >= 0.86 (NO upper
# bound — this is the ceiling tier of the UP ladder). BLEND output caps
# at ~0.9214 due to classifier-head saturation, so in practice this
# strategy fires on the very-high-conviction blended UP signals in the
# [0.86, 0.92] regime. Reads the EXISTING probability_lgb_v9_5_eth
# column.
#
# BAND PROVENANCE (v9.5 ETH BLEND walk-forward OOF band sweep):
#   Band [0.86, 0.88): n=26, 100% WR, Wilson LB 87.1%.
#   Cumulative p >= 0.86: even better (Wilson LB rises as the ceiling
#   region is dominated by the [0.86, 0.88] pocket plus the saturation
#   ceiling [0.88, 0.92]).
#
# entry_cap=0.93: BLEND caps at 0.9214 so 0.93 leaves a slim margin —
# intentional, matches PR #595 convention.
#
# Implementation note: ceiling tier uses up_threshold_max=2.0 (impossible
# upper — calibrated p never reaches 2.0) so the band check effectively
# becomes a one-sided p >= 0.86. The same band-check codepath is shared
# with up_low / up_mid for uniformity.
#
# eval_offset [60, 240], single-tick fire, ETH-only defensive guard.
# Defaults GHOST. $5 max_position_usd.
#
# References: RDS notes #631 / #632; sibling PR
# `feat/v9_5_eth_pure_lgb_strategy` (orthogonal data path).
#
status: GHOST
description: |
  UP-HIGH ceiling tier of the v9.5 ETH BLEND ladder. Fires UP when
  probability_lgb_v9_5_eth >= 0.86 (no upper bound — BLEND caps at
  ~0.9214 due to classifier saturation), within eval_offset [60, 240],
  on any single qualifying tick. ETH-only (defensive asset guard).
  Band [0.86, 0.88): n=26 in OOF, 100% WR, Wilson LB 87.1%.
  GHOST mode, $5 max_position_usd.
mode: GHOST
asset: ETH
timescale: 5m

hooks_file: v9_5_eth_blend_up_high.py
pre_gate_hook: evaluate_v9_5_eth_blend_up_high

sizing:
  type: kelly
  fraction: 0.025
  max_collateral_pct: 0.025

gates:
  - type: chainlink_freshness

gate_params:
  up_threshold: 0.86
  up_threshold_max: 2.0        # impossible upper — ceiling tier (calibrated p <= 1.0)
  eval_offset_min: 60
  eval_offset_max: 240
  min_consecutive_pass_ticks: 1
  expected_asset: ETH
  entry_cap: 0.93
  collateral_pct: 0.025
  gtc_cap: 0.96

risk:
  max_position_usd: 5
  max_daily_loss_usd: 20
