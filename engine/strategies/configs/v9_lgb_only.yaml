name: v9_lgb_only
version: "9.1.0-lgb"
# v9_lgb_only — 2026-04-25 — LGB-only fork of v9_ensemble.
#
# Created because v9_ensemble was performing well in LGB-only mode (71% WR
# over 3h, 57% over 8h) while the classifier was being rebuilt on a GPU box.
# This fork preserves the proven LGB-only config as a standalone strategy.
#
# All v9 features preserved: 3-tick entry confirmation, delta alignment gate,
# mark-to-market exit monitoring, VHC bypasses, oracle-majority cross-veto.
#
# The hook (v9_lgb_only.py) delegates to v9_ensemble's evaluate function.
# Since primary_signal_source=lgb and no classifier is wired,
# probability_classifier is always None → fallback to v8_lgb_only gate path.
#
# To switch back to ensemble mode, just change mode to GHOST and let
# v9_ensemble (with classifier) take over as LIVE.
mode: LIVE
asset: BTC
timescale: 5m

gates: []

gate_params:
  # ── All v8_lgb_only gates inherited ──────────────────────────────────
  # 2026-04-26 (audit #319): bumped from 24 → 45.
  # FAK ladder takes 10-25s end-to-end (RFQ poll 5s + ladder retries +
  # CLOB submit). With min_offset_sec=24, every fired trade hit
  # ``eval_offset_past_close`` mid-execution because window closed
  # before the FAK could fill. Empirical: 0/30 fills since 15:30 UTC.
  # 45s gives execution headroom while still allowing entries up to T-200.
  min_offset_sec: 45
  max_offset_sec: 200
  tradeable_v4_regimes: [volatile_trend, chop, risk_off, calm_trend]

  block_down_vpin_regimes: []
  block_up_vpin_regimes: []

  source_agreement_require_chainlink: true
  source_agreement_require_tiingo: true
  skip_on_oracle_disagree: true

  vpin_min: 0.40
  vpin_max: 1.0

  fill_band_min: 0.00
  fill_band_max: 0.82

  up_min_fill_price: 0.20
  down_min_fill_price: 0.15

  blocked_utc_hours: []
  post_loss_cooldown_min: 20

  # ── LGB safety floor ────────────────────────────────────────────────
  lgb_dist_min_up: 0.15
  lgb_dist_min_down: 0.10
  lgb_dist_min_up_with_hc_agree: 0.05
  lgb_dist_min_down_with_hc_agree: 0.05

  # ── v9 ensemble params (kept for compatibility, classifier always None) ──
  ensemble_disagreement_threshold: 0.35
  require_direction_agreement: true

  pc_weight_t_60: 0.70
  pc_weight_t_120: 0.55
  pc_weight_t_180: 0.40
  pc_weight_t_200: 0.25

  vhc_threshold: 0.25
  vhc_bypass_transition: true
  vhc_bypass_up_dist: true
  vhc_bypass_disagreement: true
  vhc_bypass_lgb_safety_floor: true
  vhc_bypass_oracle_direction: true
  vhc_kelly_multiplier: 2.0

  # ── PL VHC bypass ───────────────────────────────────────────────────
  pl_vhc_bypass_enabled: true
  pl_vhc_threshold: 0.25
  pl_vhc_require_pc_agreement: true

  # ── TRANSITION strong-oracle bypass ─────────────────────────────────
  transition_strong_bypass_enabled: true
  transition_bypass_min_avg_pct_delta: 0.05
  transition_bypass_min_lgb_dist: 0.20

  # Conviction tiers
  conviction_high_dist: 0.20
  conviction_medium_dist: 0.12
  conviction_low_dist: 0.05

  # ── Delta alignment gate ────────────────────────────────────────────
  delta_gate_enabled: true
  min_alignment_bps: 1.0

  # ── 3-tick entry confirmation ───────────────────────────────────────
  min_consecutive_pass_ticks: 3

  # ── Post-fill exit monitoring ───────────────────────────────────────
  exit_monitor_enabled: true
  exit_shadow_mode: false
  # Legacy single-tier params (now overridden by exit_tiers below; kept
  # as fallback if exit_tiers is removed).
  exit_eval_start_offset: 200          # outermost edge for legacy fallback
  exit_eval_end_offset: 30
  exit_max_retries: 1
  exit_retry_timeout_seconds: 5
  exit_mark_min_pct: 0.70
  exit_mark_ticks: 3

  # ── Multi-tier exit ladder (PR #402, 2026-04-27) ────────────────────
  # Three contiguous tiers covering T-200..T-30. Far from close: tight
  # threshold + long confirmation. Near close: looser threshold + faster
  # trigger. Past T-30: no exits (book too thin to sell into).
  exit_tiers:
    - { name: tier1_early,      start_offset: 200, end_offset: 120, mark_pct: 0.50, mark_ticks: 5 }
    - { name: tier2_mid,        start_offset: 120, end_offset: 60,  mark_pct: 0.55, mark_ticks: 4 }
    - { name: tier3_aggressive, start_offset: 60,  end_offset: 30,  mark_pct: 0.70, mark_ticks: 3 }

  # ── Signal-flip detector (exit-only; reverse re-entry deferred v2) ──
  flip_enabled: true
  flip_p_threshold: 0.85
  flip_dist_threshold: 0.20
  flip_consecutive_ticks: 3
  flip_min_offset: 60
  flip_max_offset: 240
  stale_mark_max_age_seconds: 5.0

  # Legacy (disabled)
  exit_lgb_flip_enabled: false
  exit_oracle_flip_enabled: false
  exit_consecutive_flip_ticks: 5

  # ── Primary signal source ───────────────────────────────────────────
  primary_signal_source: lgb
  fallback_to_lgb_on_pc_null: true

sizing:
  type: custom
  custom_hook: clob_sizing
  fraction: 0.025
  max_collateral_pct: 0.058
  schedule:
    - { threshold: 0.55, modifier: 2.5, label: "vhc_reinforced" }
    - { threshold: 0.45, modifier: 2.0, label: "high" }
    - { threshold: 0.35, modifier: 1.2, label: "medium" }
    - { threshold: 0.25, modifier: 1.0, label: "low" }
    - { threshold: 0.0,  modifier: 0.0, label: "skip" }

hooks_file: v9_lgb_only.py
pre_gate_hook: evaluate_v9_lgb_only
