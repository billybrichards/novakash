name: v_eth_15m_classifier_top20
version: "1.0.0"
mode: GHOST
asset: ETH
timescale: 15m

# Data-backed: 15m_head_v1 trained on BTC+ETH+SOL+XRP (1253 windows each)
# per s3://bbrnovakash-models-do-not-delete/timesfm_finetune/15m_v1/15m_v1/fine_tune_metrics.json.
# Top-20% conviction filter → 80.8% accuracy (n=753 holdout).
# min_dist=0.12 → p_classifier outside [0.38, 0.62] = top 20% by conviction.
#
# Hour blocklist carried from BTC 15m (sweep 2b) as starting prior;
# re-derive after 7d ETH ghost data.

gates:
  - type: timing
    params: { min_offset: 180, max_offset: 540 }
  - type: direction
    params: { direction: ANY }
  - type: confidence
    params: { min_dist: 0.12, source: classifier }
  - type: session_hours
    params: { block_hours_utc: [0, 1, 4, 10, 12, 16, 18, 22] }
  - type: regime_v4
    params: { allow: [volatile_trend, chop, risk_off] }
  - type: consecutive_pass_ticks
    params: { min_ticks: 12 }

sizing:
  type: fixed_kelly
  fraction: 0.020
  max_collateral_pct: 0.04
