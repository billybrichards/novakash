name: v9_5_xrp_tight
strategy_id: v9_5_xrp_tight
version: "1.0.0"
# v9_5_xrp_tight — 2026-05-23 (Billy approved)
#
# High-precision sibling of v9_5_xrp_raw_lgb. Reads the SAME
# probability_lgb_v9_5_xrp signal but at the tight-corner operating point:
# UP p>=0.95 / DOWN p<=0.05. Walk-forward CV results (8.62d corpus,
# 1505 windows, 928 OOF):
#   - UP   threshold 0.95 -> 80.9% WR on 282 UP windows
#   - DOWN threshold 0.05 -> 83.1% WR on 319 DOWN windows
#
# IMPORTANT: XRP cannot match the v9.3 BTC 90%+ tight corner. The 8.62d
# XRP corpus is thinner than v9.3 BTC's 24d and 9 features are NaN-filled
# at both train AND serve (no XRP emitter for binance_depth_*/clob_pre_*).
# UP-side absolute ceiling is ~83% WR at thr=0.97 (n=263). 90%+ pockets
# exist ONLY on DOWN at thr<=0.005 with n=241 — too close to a degenerate
# always-fire-DOWN point to ship safely.
#
# Co-exists with v9_5_xrp_raw_lgb in this PR. The two strategies read the
# SAME probability column but at DIFFERENT operating points. Both default
# GHOST. v9_5_xrp_tight is the "high-precision LIVE-candidate" once shadow
# data validates the tight thresholds.
#
# Tradeable fire band: median first-fire stc=104-105s (eval_offset~195s)
# — the tight corners require strong conviction that builds late in the
# window. eval_offset_min=120 covers the q25 first-fire band; max=240
# allows persistence to window close.
#
# Asset: XRP only. Strategy will SKIP defensively on any non-XRP surface.
# No v9_ensemble base-gate delegation, no cohort gates, no sister-pair veto,
# no cell pauses, no blocked hours. Single qualifying tick is enough.
#
# Defaults GHOST. Billy promotes manually per feedback_no_auto_promote.md
# (post-2026-04-17 rule — no auto-promote). $5 max_position_usd for the
# initial shadow window.
#
# DEPENDENCIES (all required before this strategy can contribute non-NULL
# probability_lgb_v9_5_xrp on the surface):
#   1. timesfm-service: emit probability_lgb_v9_5_xrp on
#      /v4/snapshot.timescales.5m when V9_5_XRP_ENABLED=true (PR #160 merged).
#   2. engine data_surface.py: probability_lgb_v9_5_xrp field (added this PR).
#   3. migrations/add_probability_lgb_v9_5_xrp_column.sql applied to prod DB.
#   4. engine signal-writer hooked up (added this PR).
#
# Timesfm-repo PR #160 — v9.5 XRP emission + production training script.
# Strategy design doc: /tmp/v9_5_xrp_strategy_design.md
# Sibling strategy in this PR: v9_5_xrp_raw_lgb (drop-in moderate).
# Engine precedent: v9_3_btc_tight (commit 5e8c147).
#
status: GHOST
description: |
  High-precision XRP 5m strategy. Reads probability_lgb_v9_5_xrp at tight
  corners: UP at p >= 0.95, DOWN at p <= 0.05. Constrained to the late-
  window band (eval_offset in [120, 240]). Single qualifying tick. XRP-only
  (defensive asset guard). No v9_ensemble delegation, no cohort gates, no
  veto layers, no cell pauses, no blocked hours. GHOST mode, $5
  max_position_usd for the initial shadow window. Walk-forward CV: 80.9%
  UP WR (282 windows) / 83.1% DOWN WR (319 windows).
mode: GHOST
asset: XRP
timescale: 5m

hooks_file: v9_5_xrp_tight.py
pre_gate_hook: evaluate_v9_5_xrp_tight

sizing:
  type: kelly
  fraction: 0.025
  max_collateral_pct: 0.025

gates:
  - type: chainlink_freshness

gate_params:
  up_threshold: 0.95
  down_threshold: 0.05
  # Late-window band — XRP tight-corner fires concentrate at
  # stc 104-105s (eval_offset ~195s). q25 first-fire is at stc 45-75s
  # (eval_offset 225-255s). Band [120, 240] captures the q25-median band.
  eval_offset_min: 120
  eval_offset_max: 240
  min_consecutive_pass_ticks: 1
  expected_asset: XRP
  entry_cap: 0.95
  collateral_pct: 0.025
  gtc_cap: 0.95

risk:
  max_position_usd: 5
  max_daily_loss_usd: 20
