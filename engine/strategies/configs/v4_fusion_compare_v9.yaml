name: v4_fusion_compare_v9
version: "1.0.0-shadow"
# Comparison shadow strategy — uses probability_lgb (raw v9, prod v5 LGB) as signal.
# Pairs with comparison_shadow.py hook. Mode=GHOST, no live trades EVER.
# See hub note #285 for the comparison framework, comparison_shadow.md for design.
mode: GHOST
asset: BTC
timescale: 5m

gates: []

gate_params:
  signal_source: probability_lgb
  shadow_strategy_id: v4_fusion_compare_v9
  shadow_conviction_floor: 0.10

# Sizing irrelevant in GHOST mode but include for schema completeness.
# fraction: 0.0 is belt-and-braces — even if mode were accidentally flipped,
# every order would be zero stake.
sizing:
  type: fixed
  fraction: 0.0
  max_collateral_pct: 0.0

hooks_file: comparison_shadow.py
pre_gate_hook: evaluate_comparison_shadow
